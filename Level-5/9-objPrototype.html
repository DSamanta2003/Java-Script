<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Object Prototype</title>
  </head>
  <body>
    <script>
      //   let animal = {
      //     eats: true,
      //   };

      //   let rabbit = {
      //     jumps: true,
      //   };
      //   rabbit.__proto__ = animal;

      class Animal {
        constructor(namee) {
          this.name = namee;
          console.log("Object is created");
        }
        eats() {
          console.log("Kha raha hu");
        }
        jumps() {
          console.log("Kud raha hu");
        }
      }

      class Lion extends Animal {
        constructor(name1) {
          super(name1);
          console.log("This is the lion");
        }
        //here eats use for Method Overriding
        eats() {
          super.eats();
          console.log("Kha raha hu,roar");
        }
      }

      let a = new Animal("Tony");
      console.log(a);

      let l = new Lion("Shera");
      console.log(l);
    </script>
  </body>
</html>
