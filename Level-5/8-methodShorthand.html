<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Method Shorthand</title>
  </head>
  <body>
    <script>
      //The Method shorthand
      let price = 500;
      //  let product = {
      //     company: 'Ango',
      //     price,
      //     itemName: 'T-shirt',
      //     displayPrice: function(){
      //         return`prie of this product is  ₹${this.price} `},
      //     };
      let product = {
        company: "Ango",
        price,
        itemName: "T-shirt",
        displayPrice() {
          return `prie of this product is  ₹${this.price} `;
        },
      };
      console.log(product.displayPrice());
      class User {
        constructor(name) {
          this.name = name;
        }
        get name() {
          return this._name;
        }
        set name(value) {
          if (value.length < 4) {
            console.log("Name is too short.");
            return;
          }
          this._name = value;
        }
      }
      let user1 = new User("John");
      console.log(user1);
      console.log(user1.name)
      user1.name = "Harry";
      console.log(user1);
    </script>
  </body>
</html>
