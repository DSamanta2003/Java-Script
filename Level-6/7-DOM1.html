<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document for Id and Class</title>
    <style>
      .container {
        margin-left: 15px;
      }
      .box {
        width: 75px;
        height: 75px;
        margin: 10px;
        border: 2px solid black;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Radha Rani1</div>
      <div id="Box2" class="box">Radha Rani2</div>
      <div class="box">Radha Rani3</div>
      <div class="box">Radha Rani4</div>
      <div class="box">Radha Rani5</div>
      <p>Hello</p>
    </div>
    <script>
      let Krishna = document.getElementsByClassName("box");
      console.log(Krishna);
      Krishna[2].style.backgroundColor = "Deeppink";

      document.getElementById("Box2").style.backgroundColor = "skyblue";

      //coloring the first matches box of class box
      document.querySelector(".box").style.backgroundColor = "yellow";

      document.querySelectorAll(".box").forEach((ele) => {
        ele.style.color = "green";
      });

      //document.querySelector('.container').nodeName
      //always returns the tag name of the element for all node types (elements, document, text nodes, comments, etc)

      //document.querySelector('.container').tagName
      //tagnames are only eligible for Html property

      //const text = document.querySelector("p").firstChild;
      // console.log(text.nodeName); o/p->#text
      // console.log(text.tagName); o/p->undefined

      // document.querySelector('.container').textContent

      //document.querySelector('.container').hidden 
      // o/p = 'false' container not hidden
      
    </script>
  </body>
</html>
