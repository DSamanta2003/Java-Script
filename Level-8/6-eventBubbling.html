<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bubling</title>
  </head>
  <style>
    .child {
      background-color: aqua;
      border: 2px solid black;
      padding: 34px;
      margin: 34px;
      cursor: pointer;
    }
    .childContainer {
      background-color: yellow;
      border: 2px solid black;
      padding: 14px;
      margin: 14px;
      cursor: pointer;
    }
    .mainContainer {
      background-color: blueviolet;
      border: 2px solid black;
      padding: 14px;
      margin: 14px;
      cursor: pointer;
    }
  </style>
  <body>
    <div class="mainContainer">
      <section class="childContainer">
        <div class="child">I am a child</div>
      </section>
    </div>
    <script>
      document.querySelector(".child").addEventListener("click", (e) => {
        // e.stopPropagation()
        //using for stop bubbling
        alert("child was clicked");
      });

      document
        .querySelector(".childContainer")
        .addEventListener("click", () => {
          alert("child container was clicked");
        });

      document.querySelector(".mainContainer").addEventListener("click", () => {
        alert(" main container was clicked");
      });
    </script>
  </body>
</html>
