<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promise</title>
  </head>
  <body>
    <script>
      console.log("This is promises");

      let prom1 = new Promise((resolve, reject) => {
        let a = Math.random();
        if (a < 0.5) {
          reject("No ramndom number was not supporting you");
        } else {
          setTimeout(() => {
            console.log("Yes I am done");
            resolve("Krishna");
          }, 2000);
        }
      });

      prom1.then((a) => {
          console.log(a);
        }).catch((err) => {
          console.log(err);
        });
    </script>
  </body>
</html>
