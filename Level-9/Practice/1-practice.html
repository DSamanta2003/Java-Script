<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function getdata() {
        return new Promise((resolve, reject) => {
          let a = Math.random();
          if (a < 0.5) {
            reject("This is reject");
          } 
          else {
            setTimeout(() => {
              resolve(455);
            }, 3500);
          }
        });
      }

      function main() {
        console.log("Helo world");
        console.log("Do something else");
        console.log("Loading data");

        let data = getdata();
        //This send get data to background tha why we should async/await
        data.then((a) => {
            console.log(a);
          }).catch((err) => {
            console.log(err);
          });

        console.log(data);
        console.log("Loaded data");
        console.log("processe data");
        console.log("task2");
      }
      main();
    </script>
  </body>
</html>
