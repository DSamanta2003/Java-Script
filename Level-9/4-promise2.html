<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promise</title>
  </head>
  <body>
    <script>
      // Simulating the same API calls returning Promises
      function selectItem(item) {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log(`Item selected: ${item}`);
            resolve(item);
          }, 1000);
        });
      }

      function createOrder(item) {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log(`Order created for: ${item}`);
            resolve("OrderID_12345");
          }, 1000);
        });
      }

      function processPayment(orderId) {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log(`Payment processed for order: ${orderId}`);
            resolve(true);
          }, 1000);
        });
      }

      function showSummary(paymentStatus) {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log("Summary: Order successfully placed!");
            resolve();
          }, 1000);
        });
      }

      // 🎉 CLEAN PROMISE CHAINING
      selectItem("Laptop")
        .then((item) => createOrder(item))
        .then((orderId) => processPayment(orderId))
        .then((paymentStatus) => showSummary(paymentStatus))
        .then(() => {
          console.log("All steps completed successfully.");
        })
        .catch((error) => {
          // One single catch block handles errors for ANY step above!
          console.error("An error occurred down the line:", error);
        });
    </script>
  </body>
</html>
